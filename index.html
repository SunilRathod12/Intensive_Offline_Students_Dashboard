<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Dashboard - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Login Page -->
    <div id="login-page" class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Admin Login</h1>
                <p>Enter password to access dashboard</p>
            </div>
            <form id="login-form">
                <div class="mb-3">
                    <label for="admin-password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="admin-password" placeholder="Enter admin password" required autofocus>
                </div>
                <div id="login-error" class="alert alert-danger" style="display: none;"></div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Loading Skeleton -->
    <div id="loading-skeleton" class="container mt-5" style="display: none;">
        <div class="header-skeleton mb-4"></div>
        <div class="row">
            <div class="col-md-4 mb-4"><div class="card-skeleton"></div></div>
            <div class="col-md-4 mb-4"><div class="card-skeleton"></div></div>
            <div class="col-md-4 mb-4"><div class="card-skeleton"></div></div>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard-content" class="container mt-4" style="display: none;">
        <header class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <h1>Student Dashboard</h1>
                <button id="logout-btn" class="btn btn-outline-light btn-sm">Logout</button>
            </div>
            
            <!-- CSV Upload Section -->
            <div class="csv-upload-section">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Upload CSV</h5>
                        <p class="card-text text-muted">Upload a new CSV file to update student data</p>
                        <div class="mb-3">
                            <input type="file" id="csv-file-input" class="form-control" accept=".csv" />
                        </div>
                        <button id="upload-csv-btn" class="btn btn-success" disabled>
                            <span id="upload-btn-text">Upload</span>
                            <span id="upload-btn-loading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true" style="display: none;"></span>
                        </button>
                        <div id="upload-status" class="mt-2"></div>
                    </div>
                </div>
            </div>

            <div class="stats-header">
                <div>
                    <span>Total Students</span>
                    <span id="total-students">--</span>
                </div>
                <div>
                    <span>Avg Score</span>
                    <span id="avg-overall">--</span>
                </div>
                <div>
                    <span>Top Performer</span>
                    <span id="top-performer">--</span>
                </div>
            </div>
            <div class="filters-sorts">
                <div class="mb-3">
                    <label for="search-input" class="form-label">Search</label>
                    <input type="text" id="search-input" class="form-control" placeholder="Search by name...">
                </div>
                <div>
                    <label for="sort-select" class="form-label">Sort by</label>
                    <select id="sort-select" class="form-select">
                        <option value="overall-best-desc">Highest Score</option>
                        <option value="overall-best-asc">Lowest Score</option>
                        <option value="name-asc">Name A-Z</option>
                        <option value="name-desc">Name Z-A</option>
                        <option value="weekly-best-desc">Best Weekly</option>
                        <option value="fortnight-best-desc">Best Fortnight</option>
                    </select>
                </div>
            </div>
        </header>
        <div id="student-cards" class="row g-3">
            <!-- Student cards will be rendered here -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
